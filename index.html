<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>SuperN — iOS</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #29203f, #101016 55%, #08080b);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
    }

    .app-icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 23px;
      background: linear-gradient(135deg, #b39aff, #6743d7);
      font-size: 40px;
      font-weight: 800;
    }

    h1 { margin: 0 0 10px; font-size: 30px; }

    p {
      color: #bcb9ca;
      font-size: 15px;
      line-height: 1.6;
    }

    .button {
      display: block;
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #a78bfa, #7652e8);
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .secondary {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.15);
    }

    .note { margin-top: 22px; font-size: 12px; color: #898698; }
  </style>
</head>
<body>
  <main class="card">
    <div class="app-icon">S</div>
    <h1>SuperN</h1>
    <p>Приложение для iPhone</p>

    <a class="button"
       href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Finek1t0524.github.io%2Fmy-ipa-site%2Fmanifest.plist">
      Установить приложение
    </a>

    <a class="button secondary"
       href="https://github.com/inek1t0524/my-ipa-site/releases/download/v1.0.0/SuperN.ipa">
      Скачать IPA
    </a>

    <p class="note">
      Установка по воздуху требует корректной подписи приложения.
      Простое скачивание IPA не устанавливает приложение на iPhone.
    </p>
  </main>
</body>
</html>
