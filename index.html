<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>SuperN — Установка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at top, #25203d 0%, #111117 45%, #08080b 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
    }

    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 23px;
      background: linear-gradient(135deg, #a78bfa, #6545d6);
      font-size: 38px;
      font-weight: 800;
      box-shadow: 0 8px 30px rgba(130, 90, 255, 0.3);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 29px;
      letter-spacing: -0.7px;
    }

    .description {
      margin: 0 0 26px;
      color: #b9b7c7;
      font-size: 15px;
      line-height: 1.6;
    }

    .install {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 15px;
      background: linear-gradient(135deg, #a78bfa, #7652e8);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 7px 24px rgba(130, 90, 255, 0.25);
      -webkit-tap-highlight-color: transparent;
    }

    .install:active {
      transform: scale(0.98);
    }

    .note {
      margin: 20px 0 0;
      color: #888697;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 26px;
      color: #666473;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">S</div>

    <h1>SuperN</h1>

    <p class="description">
      Установка приложения на iPhone.
      Нажми на кнопку ниже, чтобы начать.
    </p>

    <a
      class="install"
      href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Finek1t0524.github.io%2Fmy-ipa-site%2Fmanifest.plist"
    >
      Установить приложение
    </a>

    <p class="note">
      Для установки требуется совместимая подпись приложения.
      Если установка не начинается, проверь сертификат и файл манифеста.
    </p>

    <div class="footer">
      SuperN · iOS
    </div>
  </main>
</body>
</html>
